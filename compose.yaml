services:
  app:
    build:
      context: .
      args:
        GIT_TAG: ${GIT_TAG:-unknown}
        GIT_REVISION: ${GIT_REVISION:-unknown}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
