name: Verify and deploy container
description: Verify release attestations before deploying the repository image via Azure OIDC
inputs:
  digest:
    description: Verified sha256 image digest
    required: true
runs:
  using: composite
  steps:
    - name: Require attestation support
      shell: bash
      env:
        ENABLED: ${{ vars.ENABLE_ATTESTATIONS != 'false' && (github.event.repository.private == false || vars.ENABLE_ATTESTATIONS == 'true') }}
      run: |
        if [[ "$ENABLED" != true ]]; then
          echo "Deployment requires enabled, supported GitHub artifact attestations" >&2
          exit 1
        fi
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Verify provenance and SBOM signer identity
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DIGEST: ${{ inputs.digest }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
        image="ghcr.io/${GITHUB_REPOSITORY,,}@$DIGEST"
        for predicate in https://slsa.dev/provenance/v1 https://spdx.dev/Document; do
          gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/heads/$DEFAULT_BRANCH" --deny-self-hosted-runners \
            --predicate-type "$predicate"
        done
    - name: Exchange Azure OIDC token, update image, and check health
      shell: bash
      env:
        DIGEST: ${{ inputs.digest }}
        AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      run: |
        : "${AZURE_CLIENT_ID:?Missing Azure client ID}"
        : "${AZURE_TENANT_ID:?Missing Azure tenant ID}"
        : "${AZURE_SUBSCRIPTION_ID:?Missing Azure subscription ID}"
        : "${AZURE_RESOURCE_GROUP:?Missing Azure resource group}"
        : "${AZURE_CONTAINER_APP:?Missing Azure container app}"
        oidc=$(curl --fail --silent --show-error \
          --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" |
          python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
        echo "::add-mask::$oidc"
        trap 'az logout >/dev/null 2>&1 || true' EXIT
        az login --service-principal --username "$AZURE_CLIENT_ID" \
          --tenant "$AZURE_TENANT_ID" --federated-token "$oidc" --output none
        unset oidc
        az account set --subscription "$AZURE_SUBSCRIPTION_ID"
        mode=$(az containerapp show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
          --query properties.configuration.activeRevisionsMode --output tsv)
        [[ "$mode" == Single ]] || { echo "Deployment requires Single revision mode" >&2; exit 1; }
        az containerapp update --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
          --image "ghcr.io/${GITHUB_REPOSITORY,,}@$DIGEST" --output none
        ready=false
        for (( attempt=0; attempt<60; attempt++ )); do
          state=$(az containerapp show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query '[properties.latestRevisionName, properties.latestReadyRevisionName]' --output tsv)
          read -r revision ready_revision <<< "${state//$'\n'/ }"
          if [[ -n "$revision" && "$revision" == "$ready_revision" ]]; then ready=true; break; fi
          sleep 3
        done
        [[ "$ready" == true ]] || { echo "The new Azure revision did not become ready" >&2; exit 1; }
        fqdn=$(az containerapp show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
          --query properties.configuration.ingress.fqdn --output tsv)
        [[ "$fqdn" =~ ^[a-zA-Z0-9.-]+$ ]]
        curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-all-errors \
          --max-time 10 --retry-max-time 180 "https://$fqdn/healthz"
