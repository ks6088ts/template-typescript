name: Bug report
description: Report a reproducible defect (not a vulnerability)
body:
  - type: markdown
    attributes:
      value: Report security vulnerabilities privately using the Security tab. Do not include secrets.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Node, pnpm, OS, and relevant logs
    validations:
      required: true
