name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without v prefix or build metadata (for example 1.2.3 or 1.3.0-rc.1)
        required: true
        type: string
permissions: {}
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      latest: ${{ steps.version.outputs.publishLatest }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Releases must run from the default branch" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Validate release version and existing tags
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' |
            node scripts/release-version.ts "$VERSION" >> "$GITHUB_OUTPUT"
      - name: Derive repository-only GHCR image
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  ci:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  publish:
    needs: [prepare, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      LATEST: ${{ needs.prepare.outputs.latest }}
      ATTESTATIONS_ENABLED: ${{ vars.ENABLE_ATTESTATIONS != 'false' && (github.event.repository.private == false || vars.ENABLE_ATTESTATIONS == 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install verified Trivy before registry login
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/install-trivy.sh "$HOME/.local/bin"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: amd64,arm64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          cache-binary: false
          driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Build Checks
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          call: check
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build once and push only an untagged multiarch digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          pull: true
          no-cache: true
          build-args: |
            GIT_REVISION=${{ github.sha }}
            GIT_TAG=${{ env.TAG }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: Scan both architectures before any release tags and generate SBOMs
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          for arch in amd64 arm64; do
            "$HOME/.local/bin/trivy" image --db-repository ghcr.io/aquasecurity/trivy-db:2 \
              --image-src remote --platform "linux/$arch" \
              --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1 "$IMAGE@$DIGEST"
            "$HOME/.local/bin/trivy" image --db-repository ghcr.io/aquasecurity/trivy-db:2 \
              --image-src remote --platform "linux/$arch" \
              --format spdx-json --output "sbom-$arch.spdx.json" "$IMAGE@$DIGEST"
          done
      - name: Attest provenance
        if: env.ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest amd64 SBOM
        if: env.ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest arm64 SBOM
        if: env.ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Mint optional repository-scoped publisher App token
        id: publisher
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Recheck policy, create immutable source tag, then promote the scanned digest
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token || github.token }}
          APP_CONFIGURED: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
          APP_TOKEN_READY: ${{ steps.publisher.outputs.token != '' }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ "$APP_CONFIGURED" == true && "$APP_TOKEN_READY" != true ]]; then
            echo "The configured publisher App did not provide a token; fallback is prohibited" >&2
            exit 1
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' |
            node scripts/release-version.ts "$VERSION"
          # Active creation rules require the publisher App's provisioned bypass.
          # Denial stops container tag promotion.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
          tags=(--tag "$IMAGE:$VERSION")
          if [[ "$LATEST" == true ]]; then tags+=(--tag "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"
          printf 'Image digest: %s@%s\n\nSource commit: %s\n\nAttestations enabled: %s\n' \
            "$IMAGE" "$DIGEST" "$GITHUB_SHA" "$ATTESTATIONS_ENABLED" > release-notes.txt
          flags=(--verify-tag --generate-notes --latest="$LATEST")
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" sbom-amd64.spdx.json sbom-arm64.spdx.json \
            "${flags[@]}" --notes-file release-notes.txt

  deploy:
    needs: publish
    if: vars.ENABLE_DEPLOYMENT == 'true'
    permissions:
      contents: read
      packages: read
      attestations: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      digest: ${{ needs.publish.outputs.digest }}
